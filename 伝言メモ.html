<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伝言メモ</title>
<style>
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    max-width: 480px;
    margin: 20px auto;
    padding: 0 16px;
    color: #222;
    background: #fafafa;
  }
  h1 {
    font-size: 1.2em;
    margin-bottom: 1em;
  }
  label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
    font-size: 0.9em;
  }
  input[type="text"], textarea, select {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    margin-top: 4px;
    font-size: 1em;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  textarea {
    resize: vertical;
  }
  fieldset {
    margin-top: 12px;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 8px 12px;
  }
  legend {
    font-weight: bold;
    font-size: 0.9em;
    padding: 0 4px;
  }
  button {
    margin-top: 16px;
    width: 100%;
    padding: 10px;
    font-size: 1em;
    background: #2d6cdf;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover {
    background: #1f57bf;
  }
  #resultArea {
    margin-top: 16px;
  }
  #resultArea h2 {
    font-size: 1em;
    margin-bottom: 4px;
  }
  #resultText {
    width: 100%;
    box-sizing: border-box;
    height: 200px;
    padding: 8px;
    font-size: 1em;
    border: 1px solid #ccc;
    border-radius: 4px;
    white-space: pre-wrap;
  }
  #copyBtn {
    background: #666;
  }
  #copyBtn:hover {
    background: #4d4d4d;
  }
  .hint {
    font-size: 0.8em;
    color: #666;
    margin-top: 4px;
  }
</style>
</head>
<body>

<h1>伝言メモ作成</h1>

<label for="company">会社名</label>
<input type="text" id="company" placeholder="例：株式会社〇〇">

<label for="name">お名前</label>
<input type="text" id="name" placeholder="例：山田 太郎 様">

<label for="business">ご用件</label>
<textarea id="business" rows="4" placeholder="例：〇〇の件でお電話くださいとのことです"></textarea>

<fieldset>
  <legend>折り返しの要否</legend>
  <label><input type="radio" name="callback" value="要"> 要</label>
  <label><input type="radio" name="callback" value="不要"> 不要</label>
  <label><input type="radio" name="callback" value="未確認" checked> 未確認</label>
</fieldset>

<button id="makeBtn">メモを作る</button>

<div id="resultArea" style="display:none;">
  <h2>作成された伝言メモ（そのままコピーできます）</h2>
  <textarea id="resultText" readonly></textarea>
  <button id="copyBtn" type="button">文面をコピー</button>
  <p class="hint" id="copyMsg"></p>
</div>

<script>
document.getElementById('makeBtn').addEventListener('click', function () {
  var company = document.getElementById('company').value.trim();
  var name = document.getElementById('name').value.trim();
  var business = document.getElementById('business').value.trim();
  var callbackRadio = document.querySelector('input[name="callback"]:checked');
  var callback = callbackRadio ? callbackRadio.value : '未確認';

  var now = new Date();
  var weekdays = ['日', '月', '火', '水', '木', '金', '土'];
  var y = now.getFullYear();
  var m = now.getMonth() + 1;
  var d = now.getDate();
  var w = weekdays[now.getDay()];
  var hh = String(now.getHours()).padStart(2, '0');
  var mm = String(now.getMinutes()).padStart(2, '0');
  var dateStr = y + '年' + m + '月' + d + '日(' + w + ') ' + hh + ':' + mm;

  var lines = [];
  lines.push(dateStr + ' 伝言メモ');
  lines.push('');
  lines.push('会社名：' + (company || '（未入力）'));
  lines.push('お名前：' + (name || '（未入力）'));
  lines.push('ご用件：' + (business || '（未入力）'));
  lines.push('折り返し：' + callback);

  var text = lines.join('\n');

  document.getElementById('resultText').value = text;
  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('copyMsg').textContent = '';
});

document.getElementById('copyBtn').addEventListener('click', function () {
  var textarea = document.getElementById('resultText');
  var msg = document.getElementById('copyMsg');
  textarea.select();
  textarea.setSelectionRange(0, textarea.value.length);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(textarea.value).then(function () {
        msg.textContent = 'コピーしました。';
      }, function () {
        fallbackCopy(msg);
      });
    } else {
      fallbackCopy(msg);
    }
  } catch (e) {
    fallbackCopy(msg);
  }
});

function fallbackCopy(msg) {
  try {
    document.execCommand('copy');
    msg.textContent = 'コピーしました。';
  } catch (e) {
    msg.textContent = 'コピーできませんでした。手動で選択してコピーしてください。';
  }
}
</script>

</body>
</html>
